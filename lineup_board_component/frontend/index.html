<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; padding: 4px 4px 4px;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color: #0f172a; background: transparent;
  -webkit-tap-highlight-color: transparent;
}
.fl-board-title {
  font-size: 1.05rem; font-weight: 800; margin: 2px 0 8px;
}
.fl-circle-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
  gap: 12px 8px;
  margin-bottom: 8px;
}
.fl-circle-slot {
  display: flex; flex-direction: column; align-items: center;
  text-align: center; min-width: 0;
}
.fl-slot-label {
  font-size: 0.72rem; font-weight: 800; letter-spacing: 0.04em;
  color: #0b3d6e; margin-bottom: 6px;
}
.fl-circle-drop {
  width: 72px; height: 72px;
  border-radius: 50%;
  border: 2px dashed #94a3b8;
  background: #f8fafc;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  transition: border-color 0.12s, box-shadow 0.12s, transform 0.12s, background 0.12s;
}
.fl-circle-drop.filled {
  border-style: solid;
  border-color: rgba(11, 61, 110, 0.35);
  background: #fff;
}
.fl-circle-drop.eligible {
  border-color: #38bdf8;
  background: #e0f2fe;
  box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
}
.fl-circle-drop.hover-target {
  border-color: #0b3d6e;
  background: #dbeafe;
  box-shadow: 0 0 0 4px rgba(11, 61, 110, 0.35);
  transform: scale(1.06);
}
.fl-circle-drop.ineligible { opacity: 0.35; }
.fl-circle-drop.open { border-color: #d08a1e; background: #fff8ec; }
.fl-open-text { font-size: 0.7rem; font-weight: 800; color: #9a5b00; letter-spacing: 0.04em; text-transform: uppercase; }
.fl-slot-hint { font-size: 0.64rem; color: #8a5300; margin-top: 5px; max-width: 92px; line-height: 1.2; }
.fl-count { font-weight: 600; color: #64748b; font-size: 0.85rem; margin-left: 6px; }
.fl-pos-badges { display: flex; gap: 3px; justify-content: center; flex-wrap: wrap; margin-top: 2px; max-width: 92px; }
.fl-pos-badge { font-size: 0.6rem; font-weight: 700; padding: 0 4px; border-radius: 3px; background: #eef3f8; color: #28507a; }
.fl-face {
  width: 72px; height: 72px;
  border-radius: 50%;
  cursor: grab;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  position: relative;
  flex-shrink: 0;
  transition: transform 0.12s, box-shadow 0.12s;
}
.fl-face.dragging {
  cursor: grabbing;
  transform: scale(1.12);
  box-shadow: 0 10px 24px rgba(11, 61, 110, 0.35);
  z-index: 50;
}
/* A long press on a photo must start a drag, not the phone's save-image / context menu,
   which cancels the pointer and drops the player nowhere. */
.fl-face, .fl-face * { -webkit-touch-callout: none; }
.fl-face * { pointer-events: none; -webkit-user-drag: none; }
.fl-face.selected { box-shadow: 0 0 0 4px #0b3d6e, 0 0 0 7px rgba(56, 189, 248, 0.55); border-radius: 50%; }
.fl-face:focus-visible, .fl-circle-drop:focus-visible, .fl-bench-zone:focus-visible { outline: 3px solid #0b3d6e; outline-offset: 3px; }
.fl-notice {
  font-size: 0.86rem; font-weight: 600; line-height: 1.3;
  border-radius: 10px; padding: 8px 10px; margin: 0 0 8px;
  border: 1px solid #cbd5e1; background: #f8fafc; color: #0f172a;
}
.fl-notice.success { border-color: #86efac; background: #f0fdf4; color: #14532d; }
.fl-notice.error { border-color: #fca5a5; background: #fef2f2; color: #7f1d1d; }
.fl-notice.select { border-color: #7dd3fc; background: #f0f9ff; color: #0b3d6e; }
.fl-face-img, .fl-face-fallback {
  width: 100%; height: 100%;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid rgba(11, 61, 110, 0.25);
  display: flex; align-items: center; justify-content: center;
  background: #edf2f7;
  overflow: hidden;
}
.fl-face-fallback-icon { font-size: 1.1rem; opacity: 0.5; position: absolute; }
.fl-face-initials { font-size: 0.82rem; font-weight: 800; z-index: 1; }
.fl-slot-player-name {
  font-size: 0.68rem; font-weight: 700; color: #334155;
  margin-top: 5px; max-width: 92px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.fl-bench-zone {
  border: 2px dashed #cbd5e1;
  border-radius: 14px;
  padding: 8px 10px 6px;
  margin-bottom: 0;
  background: #fafbfc;
  transition: border-color 0.12s, background 0.12s, box-shadow 0.12s;
}
.fl-bench-zone.eligible {
  border-color: #38bdf8;
  background: #eff6ff;
  box-shadow: inset 0 0 0 2px rgba(56, 189, 248, 0.2);
}
.fl-bench-zone.hover-target { border-color: #0b3d6e; background: #dbeafe; }
.fl-bench-faces {
  display: flex; flex-wrap: wrap; gap: 10px;
  justify-content: center; padding: 4px 0 2px;
}
.fl-bench-face-wrap {
  display: flex; flex-direction: column; align-items: center; min-width: 72px;
}
.fl-bench-name {
  font-size: 0.66rem; font-weight: 700; color: #475569;
  margin-top: 4px; max-width: 80px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.fl-drag-ghost {
  position: fixed; pointer-events: none; z-index: 9999;
  width: 72px; height: 72px;
  border-radius: 50%;
  transform: translate(-50%, -50%) scale(1.12);
  box-shadow: 0 12px 28px rgba(11, 61, 110, 0.4);
  opacity: 0.95;
}
body.fl-drag-active { overflow: hidden; touch-action: none; }
@media (max-width: 480px) {
  .fl-circle-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 6px; }
}
</style>
</head>
<body>
<div id="fl-board-root"></div>
<script>
(function() {
  const BENCH = "__bench__";
  const TOUCH_HOLD_MS = 280;
  const MOUSE_DRAG_DIST = 5;
  const TOUCH_CANCEL_DIST = 10;

  function sendMessage(type, data) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
  }
  function setFrameHeight(height) {
    sendMessage("streamlit:setFrameHeight", { height: height });
  }
  function setComponentValue(value) {
    sendMessage("streamlit:setComponentValue", { value: value });
  }

  const RENDER_EVENT = "streamlit:render";
  let PAYLOAD = {};
  let assignments = {};
  let drag = null;
  let ghost = null;
  let activePointer = null;
  // Tap-to-assign: tap a player, then tap a highlighted position (or the bench). Uses the
  // same move event as a drag, so the server applies both the same way.
  let selected = "";
  let localNotice = null;

  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function(c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function slotLabel(key) {
    const slot = (PAYLOAD.slots || []).find(function(s) { return s.key === key; });
    return slot ? slot.label : key;
  }

  function originOf(player) {
    return Object.keys(assignments).find(function(k) { return assignments[k] === player; }) || "";
  }

  function noticeHtml() {
    let n = localNotice || PAYLOAD.notice || null;
    if (selected) {
      n = { level: "select", text: "Selected " + selected + ". Tap a highlighted position"
        + (originOf(selected) ? ", or the bench," : "") + " to move them. Tap them again to cancel." };
    }
    if (!n || !n.text) return "";
    const level = ["success", "error", "select"].indexOf(n.level) >= 0 ? n.level : "";
    return '<div class="fl-notice ' + level + '" role="status" aria-live="polite">' + esc(n.text) + '</div>';
  }

  function boardHeight() {
    const slots = PAYLOAD.slots || [];
    const roster = PAYLOAD.roster || [];
    const slotCount = slots.length;
    const assigned = Object.values(assignments).filter(Boolean).length;
    const benchCount = Math.max(0, roster.length - assigned);
    const slotRows = Math.max(1, Math.ceil(slotCount / 4));
    const benchRows = benchCount ? Math.max(1, Math.ceil(benchCount / 6)) : 0;
    return 52 + (20 + slotRows * 112) + (18 + (benchRows ? benchRows * 92 : 36)) + 4;
  }

  function faceHtml(name) {
    const faces = PAYLOAD.faces || {};
    const data = faces[name];
    if (!data) {
      return '<div class="fl-face-fallback"><span class="fl-face-initials">?</span></div>';
    }
    if (typeof data === "string") {
      return data;
    }
    const safeName = String(name || "");
    if (data.url) {
      return '<img class="fl-face-img" src="' + data.url + '" alt="' + esc(safeName) + '" draggable="false" />';
    }
    const initials = String(data.initials || "?");
    return '<div class="fl-face-fallback" aria-label="' + safeName + '">'
      + '<span class="fl-face-fallback-icon" aria-hidden="true">⚾</span>'
      + '<span class="fl-face-initials">' + initials + '</span></div>';
  }

  function benchPlayers() {
    const starters = new Set();
    Object.values(assignments).forEach(function(p) { if (p) starters.add(p); });
    const roster = PAYLOAD.roster || [];
    return roster.filter(function(name) { return !starters.has(name); });
  }

  function eligibleFor(slotKey, player) {
    const slot = (PAYLOAD.slots || []).find(function(s) { return s.key === slotKey; });
    if (!slot) return false;
    return (slot.eligible || []).indexOf(player) >= 0;
  }

  function benchPositions(name) {
    const row = (PAYLOAD.bench || []).find(function(b) { return b.name === name; });
    return row && row.positions ? String(row.positions).split("/").filter(Boolean) : [];
  }

  function render() {
    const root = document.getElementById("fl-board-root");
    const slots = PAYLOAD.slots || [];
    const bench = benchPlayers();
    const filledCount = slots.filter(function(s) { return !!assignments[s.key]; }).length;
    const editable = PAYLOAD.editable !== false;
    let html = noticeHtml();
    html += '<div class="fl-board-title">Starting Lineup<span class="fl-count">' + filledCount + '/' + slots.length + '</span></div><div class="fl-circle-grid">';
    slots.forEach(function(slot) {
      const player = assignments[slot.key] || "";
      const filled = !!player;
      html += '<div class="fl-circle-slot">';
      html += '<div class="fl-slot-label">' + slot.label + '</div>';
      html += '<div class="fl-circle-drop' + (filled ? ' filled' : ' open') + '" data-slot-key="' + slot.key + '" data-base-slot="' + slot.base_slot + '"'
        + (editable ? ' tabindex="0" role="button" aria-label="' + esc(slot.label + (filled ? ": " + player : ": open")) + '"' : '') + '>';
      if (filled) {
        html += '<div class="fl-face' + (selected === player ? ' selected' : '') + '" data-player="' + esc(player) + '" data-origin="' + slot.key + '"'
          + ' tabindex="0" role="button" aria-pressed="' + (selected === player) + '" aria-label="' + esc(player + ", " + slot.label) + '">' + faceHtml(player) + '</div>';
      } else {
        html += '<span class="fl-open-text">Open</span>';
      }
      html += '</div>';
      if (filled) {
        html += '<div class="fl-slot-player-name">' + player + '</div>';
      } else {
        // Eligibility cue: how many bench players could fill this spot (same eligibility list the drop uses).
        const options = bench.filter(function(name) { return (slot.eligible || []).indexOf(name) >= 0; }).length;
        html += '<div class="fl-slot-hint">' + (options ? options + ' on bench can play here' : 'No one eligible') + '</div>';
      }
      html += '</div>';
    });
    html += '</div><div class="fl-board-title">Bench<span class="fl-count">' + bench.length + '</span></div>';
    html += '<div class="fl-bench-zone" data-zone="bench"' + (editable ? ' tabindex="0" role="button" aria-label="Bench"' : '') + '><div class="fl-bench-faces">';
    bench.forEach(function(name) {
      html += '<div class="fl-bench-face-wrap">';
      html += '<div class="fl-face' + (selected === name ? ' selected' : '') + '" data-player="' + esc(name) + '" data-origin="bench"'
        + ' tabindex="0" role="button" aria-pressed="' + (selected === name) + '" aria-label="' + esc(name + ", bench") + '">' + faceHtml(name) + '</div>';
      html += '<div class="fl-bench-name">' + name + '</div>';
      const pos = benchPositions(name);
      if (pos.length) {
        html += '<div class="fl-pos-badges">' + pos.map(function(p) { return '<span class="fl-pos-badge">' + p + '</span>'; }).join("") + '</div>';
      }
      html += '</div>';
    });
    html += '</div></div>';
    root.innerHTML = html;
    bindFaces();
    bindZones();
    if (selected) markTargets(selected);
    fitFrame();
  }

  function markTargets(player) {
    document.querySelectorAll(".fl-circle-drop").forEach(function(drop) {
      if (eligibleFor(drop.dataset.slotKey, player)) drop.classList.add("eligible");
      else drop.classList.add("ineligible");
    });
    const bench = document.querySelector(".fl-bench-zone");
    if (bench && originOf(player)) bench.classList.add("eligible");
  }

  // Tap on a player: select them; tap the selected player again: cancel; with a player
  // selected, tapping a starter's face means "move the selected player to that position".
  // A face tap redraws the board, so the browser's follow-up click lands on whatever is
  // under the finger now (often the bench). Zones ignore that click.
  let ignoreZoneClickUntil = 0;

  function handleFaceTap(face) {
    const player = face.dataset.player;
    if (!player) return;
    ignoreZoneClickUntil = Date.now() + 300;
    if (PAYLOAD.editable === false) { sendPlayerSelect(player); return; }
    localNotice = null;
    if (selected === player) { selected = ""; render(); return; }
    const origin = face.dataset.origin || "bench";
    if (selected && origin !== "bench") { tryMove(origin); return; }
    selected = player;
    render();
  }

  function tryMove(target) {
    const player = selected;
    if (!player) return;
    if (target === BENCH) {
      if (!originOf(player)) { selected = ""; localNotice = { level: "error", text: player + " is already on the bench." }; render(); return; }
    } else if (!eligibleFor(target, player)) {
      localNotice = { level: "error", text: player + " can't play " + slotLabel(target) + "." };
      selected = ""; render(); return;
    }
    selected = ""; localNotice = null;
    sendDrop(player, target);
  }

  function bindZones() {
    if (PAYLOAD.editable === false) return;
    document.querySelectorAll(".fl-circle-drop").forEach(function(drop) {
      const go = function(e) {
        if (e.type === "click" && Date.now() < ignoreZoneClickUntil) return;
        if (e.target.closest && e.target.closest(".fl-face")) return;  // faces handle their own taps
        if (selected) tryMove(drop.dataset.slotKey);
      };
      drop.addEventListener("click", go);
      drop.addEventListener("keydown", function(e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(e); } });
    });
    const bench = document.querySelector(".fl-bench-zone");
    if (bench) {
      const go = function(e) {
        if (e.type === "click" && Date.now() < ignoreZoneClickUntil) return;
        if (e.target.closest && e.target.closest(".fl-face")) return;
        if (selected) tryMove(BENCH);
      };
      bench.addEventListener("click", go);
      bench.addEventListener("keydown", function(e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(e); } });
    }
  }

  // Size the iframe to what was actually drawn: the grid fits 9+ spots per row on desktop and
  // 3 on phones, so a fixed rows-of-4 estimate left a large empty gap under the bench.
  function fitFrame() {
    const root = document.getElementById("fl-board-root");
    const measured = root ? Math.ceil(root.getBoundingClientRect().height) + 12 : 0;
    setFrameHeight(measured > 40 ? measured : boardHeight());
  }
  window.addEventListener("resize", function() { if (!drag) fitFrame(); });

  function sendDrop(player, target) {
    const out = Object.assign({}, assignments);
    const origin = Object.keys(out).find(function(k) { return out[k] === player; }) || "";
    if (target === BENCH) {
      if (origin) out[origin] = "";
    } else if (target && Object.prototype.hasOwnProperty.call(out, target)) {
      out[target] = player;
      if (origin && origin !== target) out[origin] = "";
    }
    assignments = out;
    render();
    setComponentValue({ player: player, target: target, assignments: out });
  }

  function sendPlayerSelect(player) {
    setComponentValue({ action: "select_player", player: player });
  }

  function clearHighlights() {
    document.querySelectorAll(".eligible,.hover-target,.ineligible").forEach(function(el) {
      el.classList.remove("eligible", "hover-target", "ineligible");
    });
  }

  function highlightAt(x, y, player) {
    clearHighlights();
    const el = document.elementFromPoint(x, y);
    if (!el) return null;
    const drop = el.closest(".fl-circle-drop");
    const bench = el.closest(".fl-bench-zone");
    if (drop) {
      const key = drop.dataset.slotKey;
      if (eligibleFor(key, player)) {
        drop.classList.add("eligible", "hover-target");
        return key;
      }
      drop.classList.add("ineligible");
      return null;
    }
    if (bench) {
      bench.classList.add("eligible", "hover-target");
      return BENCH;
    }
    return null;
  }

  function startDrag(face, player, origin, x, y) {
    selected = ""; localNotice = null;
    drag = { face: face, player: player, origin: origin, active: true };
    face.classList.add("dragging");
    face.style.visibility = "hidden";
    document.body.classList.add("fl-drag-active");
    ghost = document.createElement("div");
    ghost.className = "fl-drag-ghost";
    ghost.innerHTML = face.innerHTML;
    ghost.style.left = x + "px";
    ghost.style.top = y + "px";
    document.body.appendChild(ghost);
    document.querySelectorAll(".fl-circle-drop").forEach(function(drop) {
      if (eligibleFor(drop.dataset.slotKey, player)) drop.classList.add("eligible");
      else drop.classList.add("ineligible");
    });
    const bench = document.querySelector(".fl-bench-zone");
    if (bench) bench.classList.add("eligible");
  }

  function endDrag(x, y) {
    if (!drag) return;
    const target = highlightAt(x, y, drag.player);
    const player = drag.player;
    drag.face.classList.remove("dragging");
    drag.face.style.visibility = "";
    if (ghost) ghost.remove();
    ghost = null;
    clearHighlights();
    document.body.classList.remove("fl-drag-active");
    const origin = drag.origin || "bench";
    drag = null;
    if (target === origin || (target === BENCH && origin === "bench")) {
      render();  // dropped back where it started
    } else if (target && (target === BENCH || eligibleFor(target, player))) {
      sendDrop(player, target);
    } else {
      // Say why instead of silently snapping back.
      const over = document.elementFromPoint(x, y);
      const drop = over && over.closest ? over.closest(".fl-circle-drop") : null;
      localNotice = drop
        ? { level: "error", text: player + " can't play " + slotLabel(drop.dataset.slotKey) + "." }
        : { level: "error", text: "Drop " + player + " on a highlighted position or the bench." };
      render();
    }
  }

  function removeWindowListeners() {
    window.removeEventListener("pointermove", onWindowPointerMove, true);
    window.removeEventListener("pointerup", onWindowPointerUp, true);
    window.removeEventListener("pointercancel", onWindowPointerUp, true);
  }

  function onWindowPointerMove(e) {
    if (!activePointer || e.pointerId !== activePointer.pointerId) return;
    handlePointerMove(e);
  }

  function onWindowPointerUp(e) {
    if (!activePointer || e.pointerId !== activePointer.pointerId) return;
    finishPointer(e);
  }

  function beginDrag(x, y) {
    if (!activePointer || activePointer.dragging) return;
    activePointer.dragging = true;
    clearTimeout(activePointer.holdTimer);
    startDrag(activePointer.face, activePointer.player, activePointer.origin, x, y);
    window.addEventListener("pointermove", onWindowPointerMove, true);
    window.addEventListener("pointerup", onWindowPointerUp, true);
    window.addEventListener("pointercancel", onWindowPointerUp, true);
  }

  function cancelPointer() {
    if (!activePointer) return;
    clearTimeout(activePointer.holdTimer);
    try { activePointer.face.releasePointerCapture(activePointer.pointerId); } catch (_) {}
    removeWindowListeners();
    activePointer = null;
  }

  function finishPointer(e) {
    if (!activePointer) return;
    const ap = activePointer;
    clearTimeout(ap.holdTimer);
    const cancelled = e.type === "pointercancel";
    try { ap.face.releasePointerCapture(ap.pointerId); } catch (_) {}
    removeWindowListeners();
    activePointer = null;
    if (ap.dragging && drag) {
      e.preventDefault();
      // A cancel (browser took the gesture) reports no useful position: use the last move.
      endDrag(cancelled ? ap.lastX : e.clientX, cancelled ? ap.lastY : e.clientY);
    } else if (!cancelled) {
      handleFaceTap(ap.face);
    }
  }

  function handlePointerMove(e) {
    if (!activePointer) return;
    const dx = e.clientX - activePointer.startX;
    const dy = e.clientY - activePointer.startY;
    const dist = Math.hypot(dx, dy);
    activePointer.lastX = e.clientX;
    activePointer.lastY = e.clientY;
    if (!activePointer.dragging) {
      if (activePointer.isTouch) {
        if (dist > TOUCH_CANCEL_DIST) cancelPointer();
      } else if (dist >= MOUSE_DRAG_DIST) {
        beginDrag(e.clientX, e.clientY);
      }
      return;
    }
    e.preventDefault();
    if (ghost) {
      ghost.style.left = e.clientX + "px";
      ghost.style.top = e.clientY + "px";
    }
    highlightAt(e.clientX, e.clientY, activePointer.player);
  }

  function onFacePointerDown(e) {
    const face = e.currentTarget;
    if (e.button !== undefined && e.button !== 0) return;
    const isTouch = e.pointerType === "touch";
    activePointer = {
      face: face,
      player: face.dataset.player,
      origin: face.dataset.origin || "bench",
      pointerId: e.pointerId,
      isTouch: isTouch,
      dragging: false,
      startX: e.clientX,
      startY: e.clientY,
      lastX: e.clientX,
      lastY: e.clientY,
      holdTimer: null
    };
    // Touch: press and hold to drag (a quick tap selects). Mouse: drag starts on movement,
    // so a click is always a tap.
    if (isTouch) {
      activePointer.holdTimer = setTimeout(function() {
        if (activePointer && !activePointer.dragging) beginDrag(activePointer.lastX, activePointer.lastY);
      }, TOUCH_HOLD_MS);
    }
    try { face.setPointerCapture(e.pointerId); } catch (_) {}
  }

  function onFacePointerMove(e) {
    if (!activePointer || e.pointerId !== activePointer.pointerId) return;
    handlePointerMove(e);
  }

  function onFacePointerUp(e) {
    if (!activePointer || e.pointerId !== activePointer.pointerId) return;
    finishPointer(e);
  }

  function onFaceTap(e) {
    const face = e.currentTarget;
    const player = face.dataset.player;
    if (player) sendPlayerSelect(player);
  }

  function bindFaces() {
    document.querySelectorAll(".fl-face").forEach(function(face) {
      face.addEventListener("contextmenu", function(e) { e.preventDefault(); });
      face.addEventListener("dragstart", function(e) { e.preventDefault(); });
      face.addEventListener("keydown", function(e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); handleFaceTap(face); }
      });
      if (PAYLOAD.editable === false) {
        face.style.cursor = "pointer";
        face.addEventListener("click", onFaceTap);
        return;
      }
      face.addEventListener("pointerdown", onFacePointerDown);
      face.addEventListener("pointermove", onFacePointerMove);
      face.addEventListener("pointerup", onFacePointerUp);
      face.addEventListener("pointercancel", onFacePointerUp);
    });
  }

  function onRender(event) {
    const args = (event && event.detail && event.detail.args) || {};
    PAYLOAD = args.payload || args || {};
    if (!PAYLOAD.slots && args.slots) {
      PAYLOAD = args;
    }
    // Streamlit re-sends the same render after a frame resize; only a new payload (the
    // server's lineup after a move) resets the board, so a refused move is undone there.
    const signature = JSON.stringify(PAYLOAD);
    if (signature !== lastSignature) {
      lastSignature = signature;
      assignments = Object.assign({}, PAYLOAD.assignments || {});
      localNotice = null;
      if (selected && (PAYLOAD.roster || []).indexOf(selected) < 0) selected = "";
    }
    render();
  }
  let lastSignature = "";

  window.addEventListener("message", function(event) {
    if (!event.data || event.data.type !== RENDER_EVENT) return;
    onRender({ detail: { args: event.data.args || {} } });
  });

  sendMessage("streamlit:componentReady", { apiVersion: 1 });
  setFrameHeight(220);
})();
</script>
</body>
</html>
