<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body style="margin: 0">
    <script>
      // Address-bar page sync (see url_page_sync.py).
      //  * Reports browser Back/Forward (popstate) to Python as {page, seq}.
      //  * Writes ?active_page= with replaceState when Python asks (mode "replace")
      //    or when the bar has drifted from the page shown (mode "none").
      //  * Never pushes: in-app navigation pushes through st.query_params.
      (function () {
        "use strict";
        var PARAM = "active_page";
        var sent = 0;

        function post(type, data) {
          var msg = { isStreamlitMessage: true, type: type };
          for (var k in data || {}) msg[k] = data[k];
          try {
            window.parent.postMessage(msg, "*");
          } catch (e) {}
        }

        function appWindow() {
          try {
            return window.parent && window.parent.location ? window.parent : null;
          } catch (e) {
            return null;
          }
        }

        function pageInBar(w) {
          try {
            return new URL(w.location.href).searchParams.get(PARAM) || "";
          } catch (e) {
            return "";
          }
        }

        function onPopState() {
          var w = appWindow();
          if (!w) return;
          sent += 1;
          post("streamlit:setComponentValue", {
            value: { page: pageInBar(w), seq: String(Date.now()) + "-" + String(sent) },
            dataType: "json",
          });
        }

        function installListener() {
          var w = appWindow();
          if (!w) return;
          try {
            // One listener per app window: drop the one a previous iframe left behind.
            if (w.__urlPageSyncPop) w.removeEventListener("popstate", w.__urlPageSyncPop);
            w.__urlPageSyncPop = onPopState;
            w.addEventListener("popstate", onPopState);
          } catch (e) {}
        }

        function render(args) {
          var w = appWindow();
          var page = String((args && args.page) || "");
          var mode = String((args && args.mode) || "none");
          if (!w || !page || mode === "push") return;
          try {
            var url = new URL(w.location.href);
            if (url.searchParams.get(PARAM) === page) return;
            url.searchParams.set(PARAM, page);
            w.history.replaceState(w.history.state, "", url.toString());
          } catch (e) {}
        }

        window.addEventListener("message", function (event) {
          var data = event.data || {};
          if (data.type === "streamlit:render") render(data.args);
        });
        installListener();
        post("streamlit:componentReady", { apiVersion: 1 });
        post("streamlit:setFrameHeight", { height: 0 });
      })();
    </script>
  </body>
</html>
