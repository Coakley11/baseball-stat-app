<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <div
      id="solo-expire-client"
      data-last=""
      data-chain=""
      data-chain-persisted=""
      data-remounts="0"
      data-deadline=""
      data-token=""
      data-remaining-ms=""
      data-browser-time=""
      data-browser-zero-ts=""
      data-component-sent-ts=""
      data-checkpoint=""
      data-iframe-instance=""
      data-timer-id=""
      style="display: none"
    ></div>
    <script>
      (function () {
        const IFRAME_INSTANCE_ID =
          "solo_" +
          String(Date.now()) +
          "_" +
          Math.random().toString(36).slice(2, 10);
        let browserSendSeq = 0;
        const FALLBACK_PERSIST_KEY = "solo_iframe_lifecycle_global";

        function classifyTargetWindow(target) {
          if (!target || target === window) return "self";
          if (target === window.parent) return "immediate_parent";
          if (target === window.top) return "top";
          return "other";
        }

        function recordSenderWindowValidity(phase, browserSendEventId) {
          var fe = null;
          try {
            fe = window.frameElement;
          } catch (e0) {
            fe = null;
          }
          var row = {
            phase: phase,
            browser_send_event_id: String(browserSendEventId || ""),
            document_connected: !!(document && document.isConnected),
            frame_element_exists: !!fe,
            frame_element_connected: fe ? !!fe.isConnected : false,
            parent_is_self: window.parent === window,
            parent_is_top: window.parent === window.top,
            iframe_instance: IFRAME_INSTANCE_ID,
            widget_key: widgetKeyArg || chainPersistKey || "",
            target_origin: "*",
            post_message_fn: "window.parent.postMessage",
          };
          try {
            row.sender_href = String(location.href || "").slice(0, 220);
          } catch (e1) {}
          noteClient("sender_window_validity", JSON.stringify(row).slice(0, 1900));
          return row;
        }

        function invokeParentPostMessage(target, payload, targetOrigin, label, browserSendEventId) {
          var targetClass = classifyTargetWindow(target);
          recordSenderWindowValidity(label || "postMessage", browserSendEventId);
          var serialized = "";
          try {
            serialized = JSON.stringify(payload).slice(0, 1900);
          } catch (e2) {
            serialized = String(payload);
          }
          noteClient(
            "outgoing_payload_" + (label || "message"),
            serialized
          );
          target.postMessage(payload, targetOrigin || "*");
        }

        function sendStage1ImmediateParentProbe(valueToken, valueWidgetKey, browserSendEventId) {
          if (!stage1ParentBoundaryProbe) return;
          var probePayload = {
            type: "solo:stage1ImmediateParentProbe",
            expected_token: valueToken,
            browser_send_event_id: browserSendEventId,
            iframe_instance_id: IFRAME_INSTANCE_ID,
            widget_key: valueWidgetKey,
            sender_ts: Date.now(),
            sender_document_href: String(location.href || "").slice(0, 220),
          };
          invokeParentPostMessage(
            window.parent,
            probePayload,
            "*",
            "solo_stage1ImmediateParentProbe",
            browserSendEventId
          );
          noteClient("stage1_immediate_parent_probe_sent", browserSendEventId);
        }

        function sendMessage(type, data) {
          var payload = Object.assign({ isStreamlitMessage: true, type: type }, data || {});
          if (type === "streamlit:setComponentValue") {
            const valueToken = String((data && data.value) || "").slice(0, 400);
            const valueWidgetKey = String((data && data.widget_key) || "");
            if (valueToken && isExpirationSendClaimed(valueToken, valueWidgetKey)) {
              noteExpirationSendSuppressed(valueToken, valueWidgetKey);
              return;
            }
            browserSendSeq += 1;
            const browserSendEventId =
              "bse_" + browserSendSeq + "_" + Date.now();
            var transportExtra = JSON.stringify({
              widget_key: valueWidgetKey,
              iframe: IFRAME_INSTANCE_ID,
              iframe_instance: IFRAME_INSTANCE_ID,
              browser_send_event_id: browserSendEventId,
              token: valueToken,
              target_origin: "*",
            });
            noteClient("transport_before_postMessage", transportExtra);
            var pmOk = false;
            var pmErr = "";
            var t0 = Date.now();
            try {
              if (valueToken) {
                claimExpirationSend(valueToken, browserSendEventId, valueWidgetKey);
                noteClient(
                  "expiration_send_claimed",
                  JSON.stringify({
                    token: valueToken,
                    widget_key: valueWidgetKey,
                    iframe_instance: IFRAME_INSTANCE_ID,
                    first_send_id: browserSendEventId,
                    claimed_at: Date.now(),
                  }).slice(0, 1900)
                );
              }
              sendStage1ImmediateParentProbe(valueToken, valueWidgetKey, browserSendEventId);
              var payloadWithMeta = Object.assign({}, payload, {
                iframe_instance: IFRAME_INSTANCE_ID,
                browser_send_event_id: browserSendEventId,
                widget_key: valueWidgetKey,
              });
              invokeParentPostMessage(
                window.parent,
                payloadWithMeta,
                "*",
                "streamlit_setComponentValue",
                browserSendEventId
              );
              pmOk = true;
            } catch (e) {
              pmErr = String(e);
              noteClient("js_exception", "postMessage:" + pmErr);
            }
            noteClient(
              "transport_postmessage_invoked",
              JSON.stringify({
                ok: pmOk,
                type: type,
                ms: Date.now() - t0,
                err: pmErr.slice(0, 200),
              })
            );
            return;
          }
          window.parent.postMessage(payload, "*");
        }

        let chainPersistKey = "";
        let widgetKeyArg = "";
        let activeToken = "";
        let stage1ParentBoundaryProbe = false;
        let tickTimer = null;
        let checkpointTimer = null;
        let sentTokens = {};
        let remountCount = 0;
        let activeDeadline = 0;

        function expirationSendClaimKey(expireToken, widgetKeyOverride) {
          const wk = String(
            widgetKeyOverride !== undefined
              ? widgetKeyOverride
              : widgetKeyArg || chainPersistKey || ""
          ).trim();
          const tok = String(expireToken || "").trim();
          return wk + "::" + tok;
        }

        function readGlobalSendClaims() {
          try {
            const root = window;
            if (!root.__soloExpirationSendClaims) {
              root.__soloExpirationSendClaims = Object.create(null);
            }
            return root.__soloExpirationSendClaims;
          } catch (e) {
            return sentTokens;
          }
        }

        function isExpirationSendClaimed(expireToken, widgetKeyOverride) {
          const key = expirationSendClaimKey(expireToken, widgetKeyOverride);
          if (!key || key === "::") return false;
          if (sentTokens[expireToken]) return true;
          const claims = readGlobalSendClaims();
          return Boolean(claims[key]);
        }

        function claimExpirationSend(expireToken, browserSendEventId, widgetKeyOverride) {
          const key = expirationSendClaimKey(expireToken, widgetKeyOverride);
          sentTokens[expireToken] = true;
          if (key && key !== "::") {
            const claims = readGlobalSendClaims();
            claims[key] = {
              token: expireToken,
              widget_key: String(
                widgetKeyOverride !== undefined
                  ? widgetKeyOverride
                  : widgetKeyArg || chainPersistKey || ""
              ),
              iframe_instance: IFRAME_INSTANCE_ID,
              first_browser_send_event_id: String(browserSendEventId || ""),
              claimed_at: Date.now(),
            };
          }
        }

        function noteExpirationSendSuppressed(expireToken, widgetKeyOverride) {
          const key = expirationSendClaimKey(expireToken, widgetKeyOverride);
          const claims = readGlobalSendClaims();
          const prior = claims[key] || {};
          noteClient(
            "expiration_send_suppressed_duplicate",
            JSON.stringify({
              token: expireToken,
              widget_key: String(
                widgetKeyOverride !== undefined
                  ? widgetKeyOverride
                  : widgetKeyArg || chainPersistKey || ""
              ),
              iframe_instance: IFRAME_INSTANCE_ID,
              first_send_id: String(prior.first_browser_send_event_id || ""),
              suppression_ts: Date.now(),
            }).slice(0, 1900)
          );
        }

        function persistStorageKey() {
          return chainPersistKey || FALLBACK_PERSIST_KEY;
        }

        function readPersistLog() {
          const key = persistStorageKey();
          try {
            const raw = localStorage.getItem(key);
            if (!raw) return [];
            const parsed = JSON.parse(raw);
            return Array.isArray(parsed) ? parsed : [];
          } catch (e) {
            return [];
          }
        }

        function writePersistLog(log) {
          const key = persistStorageKey();
          try {
            localStorage.setItem(key, JSON.stringify(log.slice(-400)));
          } catch (e) {}
        }

        function appendPersist(stage, extra) {
          const log = readPersistLog();
          log.push({
            ts: Date.now(),
            stage: stage,
            extra: extra || "",
            iframe: IFRAME_INSTANCE_ID,
          });
          writePersistLog(log);
          try {
            const node = document.getElementById("solo-expire-client");
            if (node) {
              node.setAttribute(
                "data-chain-persisted",
                log.map(function (e) {
                  return e.stage;
                }).join("|")
              );
              node.setAttribute("data-chain-persist-key", persistStorageKey());
              node.setAttribute("data-iframe-instance", IFRAME_INSTANCE_ID);
              try {
                node.setAttribute(
                  "data-persist-log-b64",
                  btoa(unescape(encodeURIComponent(JSON.stringify(log.slice(-120)))))
                );
              } catch (e3) {}
            }
          } catch (e2) {}
        }

        function noteClient(stage, extra) {
          try {
            const node = document.getElementById("solo-expire-client");
            if (!node) return;
            const chain = String(node.getAttribute("data-chain") || "");
            node.setAttribute("data-last", stage);
            node.setAttribute(
              "data-chain",
              chain ? chain + "|" + stage : stage
            );
            if (extra) {
              node.setAttribute("data-checkpoint", String(extra).slice(0, 2000));
            }
            appendPersist(stage, extra);
          } catch (e) {}
        }

        function clearTick(reason) {
          if (tickTimer) {
            noteClient(
              "tick_cancelled",
              "reason=" +
                (reason || "unknown") +
                " timer_id=" +
                tickTimer +
                " remounts=" +
                remountCount
            );
            clearTimeout(tickTimer);
            tickTimer = null;
          }
        }

        function clearCheckpoint() {
          if (checkpointTimer) {
            clearInterval(checkpointTimer);
            checkpointTimer = null;
          }
        }

        function updateDiagFields(expireToken, deadline) {
          try {
            const node = document.getElementById("solo-expire-client");
            if (!node) return;
            const nowMs = Date.now();
            const nowSec = Math.floor(nowMs / 1000);
            node.setAttribute("data-remounts", String(remountCount));
            node.setAttribute("data-token", expireToken || "");
            node.setAttribute("data-deadline", String(deadline || ""));
            node.setAttribute("data-browser-time", String(nowSec));
            const remMs = Math.max(0, Math.ceil(deadline * 1000 - nowMs));
            node.setAttribute("data-remaining-ms", String(remMs));
            node.setAttribute("data-iframe-instance", IFRAME_INSTANCE_ID);
            if (tickTimer) {
              node.setAttribute("data-timer-id", String(tickTimer));
            }
            appendPersist("diag_remaining_snapshot", "rem_ms=" + remMs + " rem_s=" + Math.ceil(remMs / 1000));
          } catch (e) {}
        }

        function sendExpireToken(expireToken) {
          if (!expireToken || activeToken !== expireToken) return;
          if (isExpirationSendClaimed(expireToken)) {
            noteExpirationSendSuppressed(expireToken);
            return;
          }
          noteClient("before_setComponentValue", expireToken);
          noteClient("iframe_setComponentValue_called");
          noteClient("setComponentValue_called");
          try {
            sendMessage("streamlit:setComponentValue", {
              value: expireToken,
              widget_key: widgetKeyArg || chainPersistKey || "",
            });
            noteClient("after_setComponentValue", "ok");
          } catch (e) {
            noteClient("js_exception", "setComponentValue:" + String(e));
            throw e;
          }
          noteClient("component_value_sent");
          try {
            const node = document.getElementById("solo-expire-client");
            if (node) {
              node.setAttribute("data-component-sent-ts", String(Date.now()));
            }
          } catch (e) {}
        }

        function startCheckpoint(expireToken, deadline) {
          clearCheckpoint();
          checkpointTimer = window.setInterval(function () {
            if (activeToken !== expireToken) return;
            const rem = Math.max(0, Math.ceil(deadline - Date.now() / 1000));
            updateDiagFields(expireToken, deadline);
            noteClient(
              "lifecycle_checkpoint",
              "rem_s=" + rem + " remounts=" + remountCount
            );
          }, 5000);
        }

        function onRender(event) {
          clearTick("streamlit_render");
          clearCheckpoint();
          const prevDeadline = activeDeadline;
          const prevToken = activeToken;
          const remBeforeMs =
            prevDeadline > 0
              ? Math.max(0, Math.ceil(prevDeadline * 1000 - Date.now()))
              : 0;
          remountCount += 1;
          const args = (event && event.detail && event.detail.args) || {};
          chainPersistKey = String(args.chain_persist_key || "").trim();
          widgetKeyArg = String(args.widget_key || "").trim();
          stage1ParentBoundaryProbe = !!(
            args.stage1_parent_boundary_probe === true ||
            args.stage1_parent_boundary_probe === 1 ||
            args.stage1_parent_boundary_probe === "1" ||
            args.stage1_parent_boundary_probe === "true"
          );
          const expireToken = String(args.expire_token || "");
          const actionable =
            !(
              args.actionable === false ||
              args.actionable === 0 ||
              args.actionable === "0" ||
              args.actionable === "false"
            );
          const parts = expireToken.split("|");
          const deadline = Number(parts[2] || 0);
          const pickPart = parts.length > 1 ? parts[1] : "";
          const draftPart = parts.length > 0 ? parts[0] : "";
          const nowMs = Date.now();
          const remMs = Number.isFinite(deadline)
            ? Math.max(0, Math.ceil(deadline * 1000 - nowMs))
            : NaN;

          activeToken = expireToken;
          activeDeadline = deadline;

          noteClient("component_script_loaded", IFRAME_INSTANCE_ID);
          noteClient("render_event_received");
          noteClient(
            "render_props_complete",
            JSON.stringify({
              actionable: actionable,
              enabled: actionable,
              draft_id: draftPart,
              pick_index: pickPart,
              expire_token: expireToken,
              deadline_sec: deadline,
              deadline_ms: Number.isFinite(deadline) ? deadline * 1000 : null,
              browser_time_sec: Math.floor(nowMs / 1000),
              browser_time_ms: nowMs,
              remaining_ms: remMs,
              remaining_sec: Number.isFinite(remMs) ? Math.ceil(remMs / 1000) : null,
              chain_persist_key: chainPersistKey || FALLBACK_PERSIST_KEY,
              iframe_instance: IFRAME_INSTANCE_ID,
              remount: remountCount,
              token_changed: prevToken !== expireToken ? 1 : 0,
              deadline_changed: prevDeadline !== deadline ? 1 : 0,
            }).slice(0, 1900)
          );
          noteClient("token_received", expireToken);
          noteClient(
            "deadline_received",
            "sec=" + deadline + " ms=" + deadline * 1000
          );
          try {
            window.parent.postMessage(
              {
                type: "solo:rvCountdownRegister",
                instance_id: IFRAME_INSTANCE_ID,
                widget_key: widgetKeyArg,
                expected_token: expireToken,
                run_id: String(args.rv_diag_run_id || ""),
                draft_id: draftPart,
                pick_index: pickPart,
                script_load_ts: Date.now(),
              },
              "*"
            );
            noteClient("instance_registered", IFRAME_INSTANCE_ID);
          } catch (eReg) {
            noteClient("js_exception", "register:" + String(eReg));
          }
          updateDiagFields(expireToken, deadline);

          if (!actionable) {
            noteClient("render_inert", "actionable_false");
            sendMessage("streamlit:setFrameHeight", { height: 0 });
            return;
          }

          if (!expireToken || !Number.isFinite(deadline) || deadline <= 0) {
            noteClient(
              "render_rejected",
              !expireToken
                ? "missing_token"
                : !Number.isFinite(deadline)
                ? "invalid_deadline_NaN"
                : "deadline_le_zero"
            );
            sendMessage("streamlit:setFrameHeight", { height: 0 });
            return;
          }

          const initialRemMs = Math.max(0, Math.ceil(deadline * 1000 - Date.now()));
          if (remountCount > 1) {
            noteClient(
              "iframe_remount",
              "n=" +
                remountCount +
                " rem_before_ms=" +
                remBeforeMs +
                " rem_after_ms=" +
                initialRemMs +
                " deadline_changed=" +
                (prevDeadline !== deadline ? 1 : 0) +
                " token_changed=" +
                (prevToken !== expireToken ? 1 : 0) +
                " abs_deadline_sec=" +
                deadline
            );
          }

          let armedThisRender = false;

          function tick() {
            if (activeToken !== expireToken) return;
            const rem = Math.max(0, Math.ceil(deadline - Date.now() / 1000));
            updateDiagFields(expireToken, deadline);
            if (rem <= 0) {
              noteClient("browser_deadline_crossed");
              try {
                const node = document.getElementById("solo-expire-client");
                if (node) {
                  node.setAttribute("data-browser-zero-ts", String(Date.now()));
                }
              } catch (e) {}
              window.setTimeout(function () {
                sendExpireToken(expireToken);
              }, 0);
              return;
            }
            tickTimer = window.setTimeout(tick, 250);
            if (!armedThisRender) {
              armedThisRender = true;
              noteClient(
                "timer_armed",
                "timer_id=" +
                  tickTimer +
                  " initial_rem_ms=" +
                  initialRemMs +
                  " initial_rem_s=" +
                  Math.ceil(initialRemMs / 1000)
              );
            }
          }

          noteClient(
            "countdown_started",
            "initial_rem_ms=" +
              initialRemMs +
              " initial_rem_s=" +
              Math.ceil(initialRemMs / 1000)
          );
          if (initialRemMs <= 0) {
            noteClient("deadline_already_expired", "deadline_sec=" + deadline);
          }
          tick();
          startCheckpoint(expireToken, deadline);
          sendMessage("streamlit:setFrameHeight", { height: 0 });
        }

        window.addEventListener("message", function (event) {
          if (!event.data || event.data.type !== "streamlit:render") return;
          onRender({ detail: { args: event.data.args || {} } });
        });

        window.addEventListener("error", function (ev) {
          noteClient(
            "js_exception",
            String(ev.message || ev.error || "error").slice(0, 500)
          );
        });
        window.addEventListener("unhandledrejection", function (ev) {
          noteClient(
            "js_exception",
            "unhandledrejection:" + String(ev.reason || "").slice(0, 500)
          );
        });

        noteClient("component_script_loaded", IFRAME_INSTANCE_ID);
        sendMessage("streamlit:componentReady", { apiVersion: 1 });
        sendMessage("streamlit:setFrameHeight", { height: 0 });
      })();
    </script>
  </body>
</html>
